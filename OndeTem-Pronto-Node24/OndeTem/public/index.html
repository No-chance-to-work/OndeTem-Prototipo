<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OndeTem</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div class="brand">📍 OndeTem</div><nav><button id="loginBtn" class="ghost">Entrar</button><button id="logoutBtn" class="ghost hidden">Sair</button></nav></header>
<main><section class="hero"><h1>Encontre onde tem o produto que você procura.</h1><p>Pesquise preços e lojas rapidamente.</p><div class="search"><input id="q" placeholder="Ex.: arroz, leite, café..."><select id="loja"><option value="0">Todas as lojas</option></select><button id="buscar">Buscar</button></div></section>
<section><div class="sectionHead"><h2>Produtos</h2><span id="userInfo"></span></div><div id="produtos" class="grid"></div></section>
<section id="admin" class="admin hidden"><h2>Painel administrativo</h2><form id="produtoForm"><input id="pNome" placeholder="Nome do produto" required><input id="pPreco" type="number" step="0.01" min="0" placeholder="Preço" required><select id="pLoja"></select><input id="pDesc" placeholder="Descrição"><input id="pImagem" placeholder="URL da imagem"><select id="pStatus"><option value="disponivel">Disponível</option><option value="indisponivel">Indisponível</option></select><button>Adicionar produto</button></form><div id="adminList"></div></section></main>
<div id="modal" class="modal hidden"><div class="box"><button class="close" id="close">×</button><h2 id="modalTitle">Entrar</h2><form id="authForm"><input id="nome" placeholder="Nome" class="hidden"><input id="email" type="email" placeholder="E-mail" required><input id="senha" type="password" placeholder="Senha" required><button id="authSubmit">Entrar</button></form><button id="toggleAuth" class="link">Criar uma conta</button><p id="msg"></p></div></div><div id="toast"></div><script src="/script.js"></script></body></html>
