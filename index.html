<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onde Tem?</title>
    <link rel="stylesheet" href="style.css">
</head>
<body id="appBody">

    <!-- ESTRUTURA 1: TELA PRINCIPAL (APP) -->
    <div id="mainAppView" class="view-section active">
        <!-- Navbar / Cabeçalho -->
        <header class="navbar">
            <div class="logo">
                <span class="logo-icon">OT</span>
                <h2>Onde Tem?</h2>
            </div>
            <div class="auth-buttons">
                <button class="btn-login" onclick="abrirTelaLogin()">Entrar</button>
                <button class="btn-signup" onclick="abrirTelaLogin()">Criar conta</button>
            </div>
        </header>

        <!-- Seção Principal de Busca -->
        <section class="hero-section">
            <h1>Encontre o produto que você precisa</h1>
            <p>Pesquise em todos os mercados da região de uma vez só.</p>

            <div class="search-container">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Ex: leite, arroz, detergente..." onkeyup="filtrarProdutos()">
            </div>

            <button class="btn-location" onclick="acaoBloqueada('Usar minha localização para ordenar lojas')">
                <span class="location-icon">✧</span> Usar minha localização para ordenar lojas
            </button>
        </section>

        <!-- Conteúdo dos Produtos -->
        <main class="products-section">
            <div class="filter-container">
                <span class="filter-label">🏪 FILTRAR POR LOJA</span>
                <div class="store-tags">
                    <button class="tag active" onclick="filtrarLoja('todas', this)">Todas as lojas</button>
                    <button class="tag" onclick="filtrarLoja('Supermercado BomPreço', this)">Supermercado BomPreço ▾</button>
                    <button class="tag" onclick="filtrarLoja('Extra Hiper', this)">Extra Hiper ▾</button>
                    <button class="tag" onclick="filtrarLoja('Pão de Açúcar', this)">Pão de Açúcar ▾</button>
                    <button class="tag" onclick="filtrarLoja('Atacadão', this)">Atacadão ▾</button>
                    <button class="tag" onclick="filtrarLoja('Carrefour Hiper', this)">Carrefour Hiper ▾</button>
                </div>
            </div>

            <div class="products-header">
                <h3>Todos os produtos <span class="badge" id="productCount">0 produtos</span></h3>
            </div>

            <!-- Grid de Produtos alimentado pelo JavaScript -->
            <div class="products-grid" id="productsGrid"></div>
        </main>
    </div>


    <!-- ESTRUTURA 2: TELA DE LOGIN (MODAL / OVERLAY) -->
    <div id="loginView" class="view-section login-overlay">
        <div class="login-card">
            <h2>Bem-vindo de volta</h2>
            <p class="subtitle">Acesse sua conta</p>

            <button class="btn-google" onclick="autenticarGoogle()">
                <svg width="18" height="18" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                Continue with Google
            </button>

            <div class="divider"><span>or</span></div>

            <form id="loginForm" onsubmit="realizarLogin(event)">
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" placeholder="Enter your email address" required>
                </div>

                <button type="submit" class="btn-continue">Continue &#9654;</button>
            </form>

            <p class="signup-text">Don't have an account? <a href="#" onclick="alert('Redirecionando para cadastro...');">Sign up</a></p>
            
            <span class="dev-badge">Development mode</span>

            <button class="btn-close-login" onclick="fecharTelaLogin()">✕ Cancelar e Voltar</button>
        </div>
    </div>

    <!-- Replit Badge (Fiel à imagem original) -->
    <div class="replit-badge">
        <span>☖ Made with Replit</span>
        <button onclick="this.parentElement.style.display='none'">✕</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
